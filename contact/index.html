<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#230122">
  <meta name="description" content="Contact Mrs Fam from Real Talk with Mrs Fam.">
  <title>Contact Mrs Fam | Real Talk with Mrs Fam</title>
  <link rel="canonical" href="https://mrsfam.com/contact">
  <link rel="stylesheet" href="/contact-assets/card.css">
  <script src="/contact-assets/card.js" defer></script>
</head>
<body>
  <main class="card" aria-labelledby="card-name">
    <div class="card-top">
      <img class="logo" src="/contact-assets/real-talk-logo.png" alt="Real Talk with Mrs Fam logo" width="1254" height="1254">
      <img class="portrait" src="/contact-assets/portrait.png" alt="Mrs Fam" width="941" height="1672" fetchpriority="high">
      <svg class="curve" viewBox="0 0 520 76" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <path fill="#c7a04e" d="M0 4 Q260 132 520 4 V76 H0Z"/>
        <path fill="#faf4e8" d="M0 8 Q260 136 520 8 V76 H0Z"/>
      </svg>
    </div>
    <div class="card-body">
      <h1 id="card-name">Mrs Fam</h1>
      <p class="brand-name">Real Talk with Mrs Fam</p>
      <p class="format">PODCAST / RADIO</p>
      <address class="contact-details">
        <a href="mailto:info@mrsfam.com">info@mrsfam.com</a>
        <a href="tel:+447768769917">+44 7768 769917</a>
        <a href="https://mrsfam.com">mrsfam.com</a>
      </address>
      <div class="actions">
        <a href="mailto:info@mrsfam.com">Email me</a>
        <a href="tel:+447768769917">Call me</a>
        <a href="https://mrsfam.com">Visit website</a>
        <a href="https://mrsfam.com/#radio-embed">Listen live</a>
        <a class="secondary" href="/contact-assets/mrs-fam.vcf" download="mrs-fam.vcf">Save contact</a>
        <button class="secondary" id="share-card" type="button" hidden>Share card</button>
      </div>
      <div class="share-fallback" id="share-fallback" hidden>
        <label for="share-url">Contact card link</label>
        <input id="share-url" type="url" readonly>
      </div>
      <p class="share-status" id="share-status" role="status"></p>
      <p class="tagline">REAL STORIES. REAL EXPERIENCES. REAL TALK.</p>
    </div>
  </main>
</body>
</html>
